services:
  - type: web
    runtime: static
    name: paradox-domain
    rootDir: paradox-domain
    buildCommand: node build.mjs
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: PARADOX_GATEWAY_URL
        sync: false
      - key: PARADOX_RESOLVER_TTL_SECONDS
        value: "60"
      - key: PARADOX_RESOLVER_VERSION
        value: "1"
    headers:
      - path: /active-domain.json
        name: Cache-Control
        value: no-store, max-age=0
      - path: /active-domain.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
