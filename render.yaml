services:
  - type: web
    runtime: node
    name: terminal-kit-controller
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm run build
    startCommand: corepack pnpm start
    healthCheckPath: /api/controller/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PARADOX_DOMAIN_RESOLVER_URL
        value: https://paradox-domain.onrender.com/active-domain.json
      - key: PARADOX_PROJECT
        value: terminal-kit
      - key: JWT_SECRET
        generateValue: true
      - key: INSTANCE_CREDENTIAL_KEY
        generateValue: true
      - key: CONTROLLER_API_KEY
        sync: false
      - key: PUBLIC_CONTROLLER_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
