services:
  - type: web
    runtime: node
    name: terminal-kit-controller
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm run build
    preDeployCommand: corepack pnpm drizzle-kit migrate
    startCommand: corepack pnpm start
    healthCheckPath: /api/controller/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INSTANCE_CREDENTIAL_KEY
        generateValue: true
      - key: PUBLIC_CONTROLLER_URL
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
